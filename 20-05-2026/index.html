<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: black;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main{
            height: 600px;
            width: 600px;
        }


        .loading-container {
            text-align: center;
            height: 600px;
            width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            border: 4px solid  #1e4308;
            border-top: 4px solid rgba(92, 214, 122, 0.988);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: white;
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 2px;
            display: flex;
            /* align-items: center;
            justify-content: center; */
            gap:20px;
            color: rgb(171, 98, 238);
        }

        .dots {
            display: flex;
            padding-top: 8px;
            justify-content: space-evenly;
            align-items: center;
            width: 20px;
            text-align: center;
            /* gap: 2px;rgba(92, 214, 122, 0.988) */
        }

        .dot {
            display: inline-flex;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: rgb(171, 98, 238);
            margin: 0 3px;
            animation: bounce 1.4s infinite ease-in-out both
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.5;
            }
            40% {
                transform: scale(2.2);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="loading-container">
            <div class="spinner"></div>
            <div class="loading-text">
                Loading
                <span class="dots">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </span>
            </div>
        </div>
    </div>
</body>
</html>
